[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "crgraph"
dynamic = ["version"]
description = "Architecture-level code review visualizer for git diffs. Never shows code."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Lukas Vlk" }]
keywords = ["code-review", "architecture", "git", "diff", "dependency-graph", "merge-request"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  # tree-sitter 0.26.0 segfaults in Node.text/start_byte under Python 3.14; 0.25.2 is verified
  "tree-sitter==0.26.0",
  "tree-sitter-language-pack==1.22.1",
  "pyyaml>=6.0",
  "anthropic>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.50", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/lukisk/crgraph"
Issues = "https://github.com/lukisk/crgraph/issues"

[project.scripts]
crgraph = "crgraph.cli:main"

[tool.hatch.version]
path = "src/crgraph/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/crgraph"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "B", "UP", "I"]

[tool.ruff.lint.isort]
known-first-party = ["crgraph"]
