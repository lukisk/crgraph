name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv venv --python ${{ matrix.python }} && uv pip install -e '.[dev]'
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: .venv/bin/ruff check
      - run: .venv/bin/crgraph grammars fetch
      - run: .venv/bin/playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - run: .venv/bin/pytest
